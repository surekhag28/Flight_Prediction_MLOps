[project]
name = "flight-prediction-mlops"
version = "0.1.0"
description = "Aviation ML Platform - Flight delay, congestion & anomaly prediction using OpenSky telemetry"
requires-python = ">=3.11"
readme = "README.md"
[dependency-groups]
core = [
    "pyspark==3.4.1",
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=14",
    "boto3>=1.34",
    "s3fs>=2024.2",
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "great-expectations>=1.3,<2.0",
]
ml = [
    "lightgbm>=4.3",
    "xgboost>=2.0",
    "catboost>=1.2",
    "scikit-learn>=1.4",
    "mlflow>=2.14,<3",
    "evidently>=0.4",
    "optuna>=3.6",
    "joblib>=1.3",
    "shap>=0.44",
    "matplotlib>=3.8",
]
feast = ["feast[redis]>=0.36"]
airflow = [
    "apache-airflow>=2.8.2",
    "apache-airflow-providers-apache-spark>=4.8",
]
serving = [
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "prometheus-client>=0.19",
    "slowapi>=0.1.9",
    "httpx>=0.27",
]
dashboard = [
    "streamlit>=1.32",
    "folium>=0.16",
    "streamlit-folium>=0.18",
    "pydeck>=0.8",
    "plotly>=5.18",
]
streaming = [
    "faust-streaming>=0.10",
    "kafka-python>=2.0",
]
dev = ["pytest>=8", "ruff>=0.3", "httpx>=0.26", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "bandit>=1.7"]
test = [
    "pytest>=8.0.0",
    "pytest-mock>=3.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
